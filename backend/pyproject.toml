[project]
name = "guixu"
version = "0.1.0"
description = "Guixu local-first Windows file organizer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "charset-normalizer>=3.5.1",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jsonschema>=4.26.0",
  "openpyxl>=3.1.5",
  "pillow>=12.3.0",
  "platformdirs==4.4.0",
  "psutil>=7.2.2",
  "pydantic==2.11.7",
  "pypdf>=6.18.1",
  "pypdfium2>=5.13.0",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "pywebview==6.0",
  "send2trash==1.8.3",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.138.15",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
]
ocr = [
    "onnxruntime>=1.30.0",
    "rapidocr==3.9.2",
]

[project.scripts]
guixu = "guixu.main:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guixu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "reportlab>=5.0.1",
]
